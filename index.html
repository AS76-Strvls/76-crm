<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>76 — CRM Βαθμοφόρων</title>
<link rel="icon" href="https://76.life/wp-content/uploads/2024/08/cropped-76icon3-32x32.jpg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--ink:#1d2733;--muted:#6b7885;--line:#d7dee6;--bg:#eef2f6;--card:#fff;--accent:#1b5e9c;--accent2:#0f3d68;
    --ageli:#f4c20d;--omada:#1e7a34;--koin:#3498db;--diktyo:#8e44ad;--sys:#334155;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  header.top{position:sticky;top:0;z-index:20;background:var(--accent2);color:#fff;padding:9px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  header.top h1{font-size:15px;margin:0 10px 0 0;font-weight:700;white-space:nowrap}
  .brand-logo{height:30px;width:30px;object-fit:contain;background:#fff;border-radius:7px;padding:2px;margin-right:9px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  #login .logo{height:78px;display:block;margin:0 auto 12px}
  #login .brandbar{height:5px;border-radius:12px 12px 0 0;margin:-24px -24px 18px;background:linear-gradient(90deg,var(--accent) 0 33%,var(--ageli) 33% 66%,#fff 66% 100%)}
  .col h3 img{height:20px;width:20px;object-fit:contain;background:#fff;border-radius:4px;padding:1px;margin-right:6px;vertical-align:middle}
  .who{font-size:12px;opacity:.9;margin-right:auto}
  .badge-role{background:#2ecc71;color:#0b3d1e;border-radius:10px;padding:1px 8px;font-weight:700;font-size:11px}
  .badge-role.viewer{background:#95a5a6;color:#fff}
  .btn{border:0;border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer;background:#2c6aa0;color:#fff;font-weight:600}
  .btn:hover{filter:brightness(1.08)} .btn.ghost{background:rgba(255,255,255,.15)} .btn.on{background:#2ecc71;color:#0b3d1e}
  .btn.sm{padding:3px 8px;font-size:12px}
  input,select{padding:6px 9px;border:1px solid var(--line);border-radius:7px;font:inherit}
  .wrap{padding:12px;max-width:1600px;margin:0 auto}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  .count{font-size:12px;color:var(--muted)}
  /* login */
  #login{max-width:380px;margin:8vh auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.12)}
  #login h2{margin:0 0 4px;color:var(--accent2)} #login p{color:var(--muted);margin:0 0 16px;font-size:13px}
  #login .field{margin-bottom:10px} #login input{width:100%}
  #login .btn{width:100%;padding:9px} .msg{font-size:12px;margin-top:8px;min-height:16px}
  .msg.err{color:#c0392b}.msg.ok{color:#1e7a34}
  /* table */
  table{border-collapse:collapse;width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{padding:6px 9px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
  th{background:#f4f7fa;position:sticky;top:52px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);cursor:pointer}
  tr:hover td{background:#f7fafc;cursor:pointer}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;border:1px solid rgba(0,0,0,.2)}
  .scout{color:var(--accent);font-weight:700;font-size:11px}
  .cross{color:#e74c3c;font-weight:800}
  .exp-red{color:#c0392b;font-weight:700}.exp-yel{color:#a9791a;font-weight:700}
  .chip{display:inline-block;font-size:10px;border-radius:4px;padding:0 5px;margin-left:3px;background:#eef2f6;color:var(--muted)}
  .sec-Αγέλη{border-left:4px solid var(--ageli)} .sec-Ομάδα{border-left:4px solid var(--omada)}
  .sec-Κοινότητα{border-left:4px solid var(--koin)} .sec-Δίκτυο{border-left:4px solid var(--diktyo)}
  .sec-Σύστημα{border-left:4px solid var(--sys)}
  /* diarthrosi */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
  .col{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .col h3{margin:0;padding:8px;color:#fff;font-size:13px;text-align:center}
  .col.Αγέλη h3{background:var(--ageli);color:#4a3b00}.col.Ομάδα h3{background:var(--omada)}
  .col.Κοινότητα h3{background:var(--koin)}.col.Δίκτυο h3{background:var(--diktyo)}
  .col ul{list-style:none;margin:0;padding:4px 6px} .col li{padding:4px;border-radius:6px;display:flex;gap:6px;align-items:center}
  .col li:hover{background:#f4f7fa;cursor:pointer}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,25,40,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:24px 12px;overflow:auto}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:12px;width:100%;max-width:520px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .modal h3{margin:0 0 10px} .row{display:flex;gap:8px;flex-wrap:wrap}
  .f{margin-bottom:8px;flex:1;min-width:120px} .f label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:2px}
  .f input,.f select{width:100%}
  .sens{background:#fff7cc;border:1px solid #e8d98a;border-radius:8px;padding:8px;font-size:13px;margin:8px 0}
  .modal-actions{display:flex;justify-content:space-between;margin-top:14px;gap:8px}
  .tag-list{font-size:12px;color:var(--muted)}
  .col.Σύστημα h3{background:var(--sys)}
  .chip.sp{background:#4a7a2a;color:#fff;font-weight:700}
  .chip.sp7{background:#ff8fb3;color:#5a1230;font-weight:700}
  .chip.net{background:var(--diktyo);color:#fff}
  .chip.loc{background:#fff;border:1px solid var(--line);color:var(--muted)}
  .role{display:inline-block;font-size:10px;font-weight:700;color:#fff;background:var(--accent);border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:middle}
  .role.head{background:#c0392b}
  .col li{align-items:flex-start}
  .dnum{flex:none;width:22px;text-align:right;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;padding-top:2px}
  .dbody{flex:1;min-width:0}
  .col .pname{font-weight:600;line-height:1.25;font-size:13px}
  .dmeta{font-size:11px;color:var(--muted);word-break:break-word}
  .col .catlabel{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:6px 6px 1px;border-top:1px dashed var(--line)}
  .col .subhead{font-size:10px;font-weight:700;color:#fff;background:var(--diktyo);border-radius:4px;display:inline-block;padding:0 6px;margin:5px 0 1px 6px}
  .col details{margin:2px 6px} .col summary{cursor:pointer;font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;padding:5px 2px;border-top:1px dashed var(--line)}
  .asband{margin-bottom:12px} .archband{margin-top:12px}
  /* sub-lists in modal (trainings + service history) */
  .seclabel{font-size:11px;font-weight:800;color:var(--accent2);margin:12px 0 3px;text-transform:uppercase;letter-spacing:.03em;border-top:1px solid var(--line);padding-top:8px}
  .subs{list-style:none;margin:2px 0;padding:0}
  .subs li{padding:4px 2px;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.35}
  .subs li b{color:var(--accent)}
  .delx{color:#c0392b;cursor:pointer;font-weight:800;float:right;padding:0 3px}
  .delx:hover{color:#e74c3c}
  .addrow{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
  .addrow input,.addrow select{padding:4px 7px;font-size:12px}
  .yr{font-weight:800;color:var(--accent2)}
  /* floating new-person button */
  #newBtn{position:fixed;right:20px;bottom:20px;z-index:40;width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:28px;line-height:1;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.3)}
  #newBtn:hover{filter:brightness(1.1)}
  #newMenu{position:fixed;right:20px;bottom:84px;z-index:41;display:none;flex-direction:column;gap:6px}
  #newMenu.show{display:flex} #newMenu .btn{box-shadow:0 4px 12px rgba(0,0,0,.25)}
  .kindchip{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:0 5px;margin-left:4px;background:#e8f0f8;color:var(--accent)}
  .kindchip.mem{background:#eaf6ea;color:#1e7a34}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="brandbar"></div>
  <img class="logo" src="https://76.life/wp-content/uploads/2024/08/76ScoutsLogo300-1.png" alt="76 Scouts">
  <h2 style="text-align:center">76 — CRM</h2>
  <p style="text-align:center">Μητρώο Βαθμοφόρων · 76ο Σ.Π. Στροβόλου<br>Σύνδεση με το email σου.</p>
  <div class="field"><input id="email" type="email" placeholder="email" autocomplete="email"></div>
  <button class="btn" id="sendBtn">Στείλε κωδικό / σύνδεσμο</button>
  <div id="otpBox" style="display:none;margin-top:10px">
    <div class="field"><input id="code" inputmode="numeric" placeholder="6ψήφιος κωδικός από email"></div>
    <button class="btn" id="verifyBtn">Σύνδεση</button>
  </div>
  <div class="msg" id="loginMsg"></div>
</div>

<!-- APP -->
<div id="app" style="display:none">
<header class="top">
  <img class="brand-logo" src="https://76.life/wp-content/uploads/2024/08/76ScoutsLogo300-1.png" alt="76">
  <h1>76 — CRM Βαθμοφόρων</h1>
  <span class="who" id="who"></span>
  <button class="btn ghost sm" id="viewToggle">🗂 Διάρθρωση</button>
  <button class="btn ghost sm" id="expToggle">⏳ Λήξεις</button>
  <button class="btn ghost sm" id="calToggle">🔔 Ημερολόγιο</button>
  <button class="btn ghost sm" id="logout">Έξοδος</button>
</header>
<div class="wrap">
  <div class="toolbar">
    <input id="search" placeholder="🔍 Αναζήτηση..." style="min-width:200px">
    <select id="fSection"><option value="">Όλα τα τμήματα</option></select>
    <select id="fKind"><option value="">Όλοι (βαθμ.+μέλη)</option><option value="Βαθμοφόρος">Βαθμοφόροι</option><option value="Μέλος">Μέλη</option></select>
    <select id="fStatus"><option value="">Όλες οι καταστάσεις</option><option>Ενεργός</option><option>Αρχειοθετημένος</option></select>
    <label style="font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center"><input type="checkbox" id="fExpired"> ληγμένα σεξόχαρτα</label>
    <span class="count" id="count"></span>
  </div>
  <div id="crm"></div>
  <div id="diarthrosi" style="display:none"></div>
  <div id="exp" style="display:none"></div>
  <div id="cal" style="display:none"></div>
</div>
<div id="newMenu"><button class="btn sm" id="newMember">＋ Μέλος</button><button class="btn sm" id="newBadge">＋ Βαθμοφόρος</button></div>
<button id="newBtn" title="Νέο άτομο" style="display:none">＋</button>
</div>

<!-- DETAIL MODAL -->
<div class="overlay" id="ov"><div class="modal">
  <h3 id="dTitle"></h3>
  <div id="dBody"></div>
  <div class="modal-actions">
    <button class="btn ghost sm" style="background:#e6ebf0;color:#333" id="dClose">Κλείσιμο</button>
    <div><button class="btn sm" id="dSens" style="background:#a5822f">🔒 Ευαίσθητα</button>
    <button class="btn sm" id="dEdit">✎ Επεξεργασία</button></div>
  </div>
</div></div>

<script>
const SB_URL='https://cofiscmvdagizlchrian.supabase.co';
const SB_KEY='sb_publishable_OvYhjMAqZ9ty6T2De2by-g_uJ6mnm50';
const sb=supabase.createClient(SB_URL,SB_KEY);
let ME={email:null,role:'viewer'}, DATA=[], EDIT_ID=null, VIEW='crm', CATALOG=[];
const SECCOLOR={'Αγέλη':'var(--ageli)','Ομάδα':'var(--omada)','Κοινότητα':'var(--koin)','Δίκτυο':'var(--diktyo)','Σύστημα':'var(--sys)'};
const SECS=['Αγέλη','Ομάδα','Κοινότητα','Δίκτυο','Σύστημα'];
const SECLOGO={'Αγέλη':'https://76.life/wp-content/uploads/2024/08/76ageliLogo-150x150.png','Ομάδα':'https://76.life/wp-content/uploads/2024/08/76omadaLogo-150x150.png','Κοινότητα':'https://76.life/wp-content/uploads/2024/08/76koinotitaLogo-150x150.png'};
const CATS=['ΑΣ','Αρχηγός','Βαθμοφόρος','YOLO','Υπεύθυνος Δικτύου','Δίκτυο','Αρχειοθετημένος'];
const MROLES=['Λυκόπουλο','Πρόσκοπος','Ανιχνευτής'];
const MSECS=['Αγέλη','Ομάδα','Κοινότητα'];
const SEC2ROLE={'Αγέλη':'Λυκόπουλο','Ομάδα':'Πρόσκοπος','Κοινότητα':'Ανιχνευτής'};
const GROUPTERM={'Αγέλη':'Εξάδα','Ομάδα':'Ενωμοτία','Κοινότητα':'Όμιλος'};
const EXADES=['Κοκκινοποί','Πορτοκαλοποί','Μωβιδεροί','Πρασινοποί','Γαλαζοποί'];
const YROLES=['Εξάρχης','Υποεξάρχης','Ενωμοτάρχης','Υπενωμοτάρχης','Ομιλάρχης','Υπομιλάρχης'];
const CUR_YEAR=(()=>{const d=new Date(),y=d.getFullYear(),s=(d.getMonth()>=7)?y:y-1;return s+'-'+String((s+1)%100).padStart(2,'0');})();
const GRADES=['Α΄ Δημ.','Β΄ Δημ.','Γ΄ Δημ.','Δ΄ Δημ.','Ε΄ Δημ.','Στ΄ Δημ.','Α΄ Γυμν.','Β΄ Γυμν.','Γ΄ Γυμν.','Α΄ Λυκ.','Β΄ Λυκ.','Γ΄ Λυκ.'];
function schoolStart(){const d=new Date();return d.getMonth()>=7?d.getFullYear():d.getFullYear()-1;}
function gradeNumFromDob(dob){const b=new Date(dob),ref=new Date(schoolStart(),8,1);let a=ref.getFullYear()-b.getFullYear();const m=ref.getMonth()-b.getMonth();if(m<0||(m===0&&ref.getDate()<b.getDate()))a--;return a-5;}
function gradeLabel(n){return(n>=1&&n<=12)?GRADES[n-1]:(n<1?'προσχολική':'μετά το Λύκειο');}
function gradeNumFromLabel(l){const i=GRADES.indexOf(l);return i>=0?i+1:null;}
function ageOutTarget(n,sec){if(sec==='Αγέλη'&&n>=5)return'Ομάδα';if(sec==='Ομάδα'&&n>=9)return'Κοινότητα';if(sec==='Κοινότητα'&&n>=12)return'Βαθμοφόρος';return null;}
function daysToNext(dstr){const t=new Date(),d=new Date(dstr),t0=new Date(t.getFullYear(),t.getMonth(),t.getDate());let nx=new Date(t.getFullYear(),d.getMonth(),d.getDate());if(nx<t0)nx=new Date(t.getFullYear()+1,d.getMonth(),d.getDate());return Math.round((nx-t0)/86400000);}

/* ---------- auth ---------- */
const $=id=>document.getElementById(id);
$('sendBtn').onclick=async()=>{
  const email=$('email').value.trim(); if(!email){msg('Δώσε email','err');return;}
  msg('Αποστολή...','');
  const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:window.location.href,shouldCreateUser:true}});
  if(error){msg(error.message,'err');return;}
  $('otpBox').style.display='block'; msg('Στάλθηκε email. Πάτα τον σύνδεσμο ή βάλε τον 6ψήφιο κωδικό.','ok');
};
$('verifyBtn').onclick=async()=>{
  const email=$('email').value.trim(), token=$('code').value.trim();
  const {error}=await sb.auth.verifyOtp({email,token,type:'email'});
  if(error){msg(error.message,'err');}
};
$('logout').onclick=async()=>{ await sb.auth.signOut(); location.reload(); };
function msg(t,c){const m=$('loginMsg');m.textContent=t;m.className='msg '+(c||'');}

sb.auth.onAuthStateChange((_e,session)=>{ if(session) start(session); });
sb.auth.getSession().then(({data})=>{ if(data.session) start(data.session); });

async function start(session){
  ME.email=session.user.email;
  const {data:prof}=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();
  ME.role=prof?.role||'viewer';
  $('login').style.display='none'; $('app').style.display='block';
  $('who').innerHTML=`${ME.email} <span class="badge-role ${ME.role!=='admin'?'viewer':''}">${ME.role}</span>`;
  $('dSens').style.display=ME.role==='admin'?'inline-block':'none';
  $('dEdit').style.display=ME.role==='admin'?'inline-block':'none';
  $('newBtn').style.display=ME.role==='admin'?'block':'none';
  SECS.forEach(s=>$('fSection').insertAdjacentHTML('beforeend',`<option>${s}</option>`));
  await load();
  sb.from('progression_catalog').select('*').eq('active',true).order('ordinal').then(({data})=>{CATALOG=data||[];});
  sb.channel('bh').on('postgres_changes',{event:'*',schema:'public',table:'badgeholders'},load).subscribe();
}

/* ---------- data ---------- */
async function load(){
  const {data,error}=await sb.from('v_status').select('*').order('last_name');
  if(error){alert(error.message);return;}
  DATA=data||[]; render();
}
function eligDot(p){
  if(p.is_commissioner) return dot('#8e44ad','Έφορος');
  const hasData=p.sexoxarto_date||p.has_prok||p.own_basic;
  if(!hasData) return dot('#c7ced6','Χωρίς στοιχεία');
  const sexC=p.sex_ok?'#27ae60':(p.sexoxarto_expiry?'#e74c3c':'#e74c3c');
  const trC=p.own_basic?'#27ae60':(p.has_prok?'#f4c20d':'#e74c3c');
  const can=(p.sex_ok&&p.own_basic)?'Εντολή':((p.sex_ok&&p.has_prok)?'Ανάθεση':'—');
  return `<span class="dot" title="Σεξόχαρτο ${p.sex_ok?'✓':'✗'} · Εκπ. ${p.own_basic?'Βασική':(p.has_prok?'Προκ.':'—')} → ${can}" style="background:linear-gradient(90deg,${sexC} 0 50%,${trC} 50% 100%)"></span>`;
}
function dot(c,t){return `<span class="dot" title="${t}" style="background:${c}"></span>`;}
function expCell(d){ if(!d) return ''; const x=new Date(d),now=new Date(),soon=new Date();soon.setDate(now.getDate()+90);
  const cls=x<now?'exp-red':(x<soon?'exp-yel':''); return `<span class="${cls}">${d.split('-').reverse().join('/')}</span>`; }
function filtered(){
  const q=$('search').value.trim().toLowerCase(), sec=$('fSection').value, st=$('fStatus').value, ex=$('fExpired').checked, kd=$('fKind').value;
  return DATA.filter(p=>{
    if(kd&&(p.kind||'Βαθμοφόρος')!==kd)return false;
    if(sec&&p.section!==sec)return false;
    if(st&&p.status!==st)return false;
    if(ex&&!(p.sexoxarto_expiry&&new Date(p.sexoxarto_expiry)<new Date()))return false;
    if(q){const s=(p.first_name+' '+p.last_name+' '+(p.scout_name||'')+' '+(p.location||'')).toLowerCase();if(!s.includes(q))return false;}
    return true;
  });
}
function render(){
  $('crm').style.display     = VIEW==='crm'?'block':'none';
  $('diarthrosi').style.display = VIEW==='dia'?'block':'none';
  $('exp').style.display     = VIEW==='exp'?'block':'none';
  $('cal').style.display     = VIEW==='cal'?'block':'none';
  if(VIEW==='crm')renderCRM(); else if(VIEW==='dia')renderDia(); else if(VIEW==='exp')renderExp(); else renderCal();
}
function renderCRM(){
  $('crm').style.display='block'; $('diarthrosi').style.display='none';
  const rows=filtered();
  $('count').textContent=`${rows.length} / ${DATA.length}`;
  if($('fKind').value==='Μέλος'){ $('crm').innerHTML=memberTable(rows); return; }
  let h=`<table><thead><tr><th></th><th>Επίθετο</th><th>Όνομα</th><th>Προσκοπικό</th><th>Τμήμα</th><th>Κατηγορία</th><th>Τοποθεσία</th><th>Τηλέφωνο</th><th>Σεξόχαρτο λήξη</th><th>Α'Β</th></tr></thead><tbody>`;
  rows.forEach(p=>{ const mem=p.kind==='Μέλος'; h+=`<tr class="sec-${p.section}" onclick="detail('${p.id}')">
    <td>${mem?'<span class="dot" title="Μέλος" style="background:#1e7a34"></span>':eligDot(p)}${!mem&&p.firstaid_ok?' <span class="cross" title="Ενεργές Α΄Βοήθειες">✚</span>':''}</td>
    <td><b>${p.last_name}</b></td><td>${p.first_name}</td>
    <td>${p.scout_name?`<span class="scout">«${p.scout_name}»</span>`:''}</td>

function diaCol(sec){
  const primary=DATA.filter(p=>p.section===sec);

    const resp=bySurname(primary.filter(p=>p.category==='Υπεύθυνος Δικτύου'));

    if(resp.length){inner+='<div class="catlabel">Υπεύθυνοι Δικτύου</div>';resp.forEach((p,i)=>inner+=personRow(p,blockNum(i,resp.length),sec));}
    if(plain.length){inner+='<div class="catlabel">Δίκτυο</div>';
      const gs={};plain.forEach(p=>{const c=(p.location||'— χωρίς περιοχή').split('-')[0];(gs[c]=gs[c]||[]).push(p);});
      let gi=0;Object.keys(gs).sort((a,b)=>a.localeCompare(b)).forEach(c=>{inner+=`<span class="subhead">${c}</span>`;gs[c].forEach(p=>{inner+=personRow(p,blockNum(gi,plain.length),sec);gi++;});});
    }
    if(extra.length)inner+=collap('Άτομα δικτύου στα τμήματα',bySurname(extra),sec);
  } else {
    const heads=bySurname(primary.filter(p=>p.category==='Αρχηγός'));

    if(vath.length){inner+='<div class="catlabel">Βαθμοφόροι</div>';vath.forEach(p=>{inner+=personRow(p,blockNum(ai,active.length),sec);ai++;});}

    if(extra.length)inner+=collap('Κοινά μέλη',bySurname(extra),sec);

    <datalist id="exList">${EXADES.map(x=>`<option>${x}</option>`).join('')}</datalist>
    <datalist id="roList">${YROLES.map(r=>`<option>${r}</option>`).join('')}</datalist></div>`:'';
  return `<div class="seclabel">🗂 Ιστορικό ανά χρονιά — ομάδα & ρόλος</div><ul class="subs">${rows}</ul>${add}`;
}
async function addMemberYear(){
  const y=$('my_year').value.trim(); if(!y){return;}
  const sec=$('my_sec').value||null;
  const rec={person_id:EDIT_ID,scout_year:y,section:sec,grade:$('my_grade').value||null,group_name:$('my_group').value.trim()||null,
    role:$('my_role').value.trim()||null,registered:$('my_reg').checked,triptycho_no:$('my_trip').value.trim()||null};
  const {error}=await sb.from('member_year').insert(rec);
  if(error){alert(error.message);return;}
  if(y===CUR_YEAR&&sec)await sb.from('badgeholders').update({section:sec,member_role:SEC2ROLE[sec]||null}).eq('id',EDIT_ID);
  await load(); loadMember(EDIT_ID);
}
async function delMemberYear(id){ const {error}=await sb.from('member_year').delete().eq('id',id); if(error){alert(error.message);return;} await load(); loadMember(EDIT_ID); }
async function memberEdit(p){
  const {data:mp}=await sb.from('member_profile').select('join_date,promise_date').eq('person_id',p.id).maybeSingle();
  const m=mp||{};
  $('dBody').innerHTML=`
   <div class="row"><div class="f"><label>Όνομα</label><input id="e_first" value="${p.first_name||''}"></div>
     <div class="f"><label>Επίθετο</label><input id="e_last" value="${p.last_name||''}"></div>
     <div class="f"><label>Προσκοπικό</label><input id="e_scout" value="${p.scout_name||''}"></div></div>
   <div class="row"><div class="f"><label>Κλάδος</label><select id="e_sec"><option value="">—</option>${MSECS.map(s=>`<option ${s===p.section?'selected':''}>${s}</option>`).join('')}</select></div>
     <div class="f"><label>Τηλέφωνο</label><input id="e_phone" value="${p.phone||''}"></div>
     <div class="f"><label>Ημ. πρώτης εγγραφής</label><input id="e_join" type="date" value="${m.join_date||''}"></div></div>
   <div class="row"><div class="f"><label>Ημ. Υπόσχεσης</label><input id="e_promise" type="date" value="${m.promise_date||''}"></div></div>
   <div class="dmeta" style="margin:6px 0">Ομάδα (εξάδα/ενωμοτία/όμιλος), ρόλος, τάξη & εγγραφή ανά χρονιά μπαίνουν από το «Ιστορικό ανά χρονιά».</div>
   <button class="btn" id="e_save" style="width:100%;margin-top:6px">💾 Αποθήκευση</button>
   <div class="msg" id="e_msg"></div>`;
  $('e_save').onclick=saveMember;
}
async function saveMember(){
  const sec=$('e_sec').value||null;
  const upd={first_name:$('e_first').value.trim(),last_name:$('e_last').value.trim(),scout_name:$('e_scout').value.trim()||null,
    section:sec,member_role:sec?(SEC2ROLE[sec]||null):null,phone:$('e_phone').value.trim()||null};
  const {error}=await sb.from('badgeholders').update(upd).eq('id',EDIT_ID);
  const msgel=$('e_msg');
  if(error){msgel.className='msg err';msgel.textContent=error.message;return;}
  const {error:e2}=await sb.from('member_profile').upsert({person_id:EDIT_ID,join_date:$('e_join').value||null,promise_date:$('e_promise').value||null,updated_at:new Date().toISOString()});
  if(e2){msgel.className='msg err';msgel.textContent=e2.message;return;}
  msgel.className='msg ok';msgel.textContent='Αποθηκεύτηκε ✓'; await load(); setTimeout(()=>$('ov').classList.remove('show'),600);
}
/* ----- sub-lists: service history (Εντολές ανά χρονιά) + trainings (σχολές) ----- */
function fmtD(d){return d?d.split('-').reverse().join('/'):'';}
async function loadSubs(id){
  const admin=ME.role==='admin';
  const [{data:sh},{data:tr}]=await Promise.all([
    sb.from('service_history').select('id,scout_year,section,appointment,appointment_no,role').eq('person_id',id).order('scout_year',{ascending:false}),
    sb.from('trainings').select('id,type,section,date').eq('person_id',id).order('date',{ascending:true,nullsFirst:true})
  ]);
  $('shBox').innerHTML=historyHTML(sh||[],admin);
  $('trBox').innerHTML=trainingsHTML(tr||[],admin);
}
function historyHTML(list,admin){
  let rows=list.map(t=>`<li><span class="yr">${t.scout_year}</span> — <b>${t.appointment||'—'}</b>${t.section?` · ${t.section}`:''}${t.appointment_no?` <span class="chip">αρ. ${t.appointment_no}</span>`:''}${t.role?` <span class="dmeta">${t.role}</span>`:''}${admin?` <span class="delx" onclick="delHistory('${t.id}')">✕</span>`:''}</li>`).join('')||'<li class="dmeta">— καμία καταχώρηση —</li>';
  const secOpts=SECS.filter(s=>s!=='Σύστημα').map(s=>`<option>${s}</option>`).join('');
  const add=admin?`<div class="addrow">
    <input id="sh_year" placeholder="χρονιά π.χ. 2025-26" style="flex:1.4">
    <select id="sh_app"><option>Εντολή</option><option>Ανάθεση</option></select>
    <select id="sh_sec"><option value="">τμήμα</option>${secOpts}</select>
    <input id="sh_no" placeholder="αρ." style="width:60px">
    <input id="sh_role" placeholder="ρόλος" style="flex:1">
    <button class="btn sm" onclick="addHistory()">＋</button></div>`:'';
  return `<div class="seclabel">🎖 Ιστορικό Εντολών / Αναθέσεων</div><ul class="subs">${rows}</ul>${add}`;
}
function trainingsHTML(list,admin){
  let rows=list.map(t=>`<li>${t.type}${t.section?` <span class="chip">${t.section}</span>`:''}${t.date?` <span class="dmeta">${fmtD(t.date)}</span>`:''}${admin?` <span class="delx" onclick="delTraining('${t.id}')">✕</span>`:''}</li>`).join('')||'<li class="dmeta">— καμία σχολή —</li>';
  const add=admin?`<div class="addrow">
    <input id="tr_type" placeholder="σχολή π.χ. Βασική" style="flex:2">
    <input id="tr_sec" placeholder="τμήμα/κλάδος" style="flex:1">
    <input id="tr_date" type="date" style="flex:1">
    <button class="btn sm" onclick="addTraining()">＋</button></div>`:'';
  return `<div class="seclabel">📚 Σχολές / Εκπαιδεύσεις</div><ul class="subs">${rows}</ul>${add}`;
}
async function addHistory(){
  const y=$('sh_year').value.trim(); if(!y){return;}
  const {error}=await sb.from('service_history').insert({person_id:EDIT_ID,scout_year:y,appointment:$('sh_app').value,
    section:$('sh_sec').value||null,appointment_no:$('sh_no').value.trim()||null,role:$('sh_role').value.trim()||null});
  if(error){alert(error.message);return;} loadSubs(EDIT_ID);
}
async function delHistory(id){ const {error}=await sb.from('service_history').delete().eq('id',id); if(error){alert(error.message);return;} loadSubs(EDIT_ID); }
async function addTraining(){
  const type=$('tr_type').value.trim(); if(!type){return;}
  const {error}=await sb.from('trainings').insert({person_id:EDIT_ID,type,section:$('tr_sec').value.trim()||null,date:$('tr_date').value||null});
  if(error){alert(error.message);return;} loadSubs(EDIT_ID);
}
async function delTraining(id){ const {error}=await sb.from('trainings').delete().eq('id',id); if(error){alert(error.message);return;} loadSubs(EDIT_ID); }
$('dClose').onclick=()=>$('ov').classList.remove('show');
$('dSens').onclick=async()=>{
  const {data,error}=await sb.from('sensitive').select('adt,dob').eq('person_id',EDIT_ID).maybeSingle();
  const box=$('sensBox');
  if(error||!data){box.innerHTML=`<div class="sens">Χωρίς πρόσβαση ή χωρίς στοιχεία.</div>`;return;}
  box.innerHTML=`<div class="sens">🔒 Α.Δ.Τ.: <b>${data.adt||'—'}</b> · Ημ. Γέννησης: <b>${data.dob?data.dob.split('-').reverse().join('/'):'—'}</b></div>`;
};
$('dEdit').onclick=()=>{
  const p=DATA.find(x=>x.id===EDIT_ID);
  if(p.kind==='Μέλος'){ memberEdit(p); return; }
  $('dBody').innerHTML=`
   <div class="row"><div class="f"><label>Όνομα</label><input id="e_first" value="${p.first_name||''}"></div>
     <div class="f"><label>Επίθετο</label><input id="e_last" value="${p.last_name||''}"></div>
     <div class="f"><label>Προσκοπικό</label><input id="e_scout" value="${p.scout_name||''}"></div></div>
   <div class="row"><div class="f"><label>Τμήμα</label><select id="e_sec"><option value="">—</option>${SECS.map(s=>`<option ${s===p.section?'selected':''}>${s}</option>`).join('')}</select></div>
     <div class="f"><label>Κατηγορία</label><select id="e_cat">${CATS.map(c=>`<option ${c===p.category?'selected':''}>${c}</option>`).join('')}</select></div>
     <div class="f"><label>Καθήκοντα</label><input id="e_head" value="${p.headrole||''}"></div></div>
   <div class="row"><div class="f"><label>Τοποθεσία</label><input id="e_loc" value="${p.location||''}"></div>
     <div class="f"><label>Τηλέφωνο</label><input id="e_phone" value="${p.phone||''}"></div>
     <div class="f"><label>Email</label><input id="e_email" value="${p.email||''}"></div></div>
   <div class="row"><div class="f"><label>Έφορος</label><select id="e_efor"><option value="false">Όχι</option><option value="true" ${p.is_commissioner?'selected':''}>Ναι</option></select></div>
     <div class="f"><label>Κατάσταση</label><select id="e_status"><option ${p.status==='Ενεργός'?'selected':''}>Ενεργός</option><option ${p.status==='Αρχειοθετημένος'?'selected':''}>Αρχειοθετημένος</option></select></div></div>
   <button class="btn" id="e_save" style="width:100%;margin-top:6px">💾 Αποθήκευση</button>
   <div class="msg" id="e_msg"></div>`;
  $('e_save').onclick=save;
};
async function save(){
  const upd={first_name:$('e_first').value.trim(),last_name:$('e_last').value.trim(),scout_name:$('e_scout').value.trim()||null,
    section:$('e_sec').value||null,category:$('e_cat').value,headrole:$('e_head').value.trim()||null,
    location:$('e_loc').value.trim()||null,phone:$('e_phone').value.trim()||null,email:$('e_email').value.trim()||null,
    is_commissioner:$('e_efor').value==='true',status:$('e_status').value};
  const {error}=await sb.from('badgeholders').update(upd).eq('id',EDIT_ID);
  const m=$('e_msg');
  if(error){m.className='msg err';m.textContent=error.message;return;}
  m.className='msg ok';m.textContent='Αποθηκεύτηκε ✓'; await load(); setTimeout(()=>$('ov').classList.remove('show'),600);
}

/* ---------- ui ---------- */
['search','fSection','fStatus','fExpired','fKind'].forEach(id=>$(id).addEventListener('input',render));
function setView(v){
  VIEW=(VIEW===v?'crm':v);
  $('viewToggle').classList.toggle('on',VIEW==='dia');
  $('expToggle').classList.toggle('on',VIEW==='exp');
  $('calToggle').classList.toggle('on',VIEW==='cal');
  render();
}
$('viewToggle').onclick=()=>setView('dia');
$('expToggle').onclick=()=>setView('exp');
$('calToggle').onclick=()=>setView('cal');
$('newBtn').onclick=()=>$('newMenu').classList.toggle('show');
async function createPerson(kind){
  $('newMenu').classList.remove('show');
  const base=kind==='Μέλος'
    ?{first_name:'Νέο',last_name:'Μέλος',kind:'Μέλος',status:'Ενεργός'}
    :{first_name:'Νέο',last_name:'Άτομο',kind:'Βαθμοφόρος',category:'Βαθμοφόρος',status:'Ενεργός'};
  const {data,error}=await sb.from('badgeholders').insert(base).select('id').single();
  if(error){alert(error.message);return;}
  if(kind==='Μέλος')$('fKind').value='Μέλος';
  await load(); if(VIEW!=='crm')setView('crm'); await detail(data.id); $('dEdit').click();
}
$('newMember').onclick=()=>createPerson('Μέλος');
$('newBadge').onclick=()=>createPerson('Βαθμοφόρος');
$('ov').addEventListener('click',e=>{if(e.target===$('ov'))$('ov').classList.remove('show');});
window.detail=detail;
window.addHistory=addHistory;window.delHistory=delHistory;window.addTraining=addTraining;window.delTraining=delTraining;
window.addMemberYear=addMemberYear;window.delMemberYear=delMemberYear;
window.addProgress=addProgress;window.delProgress=delProgress;
</script>
